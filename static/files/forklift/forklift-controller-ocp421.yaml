# Forklift controller, OpenShift 4.21 and earlier.
#
# Apply after forklift-operator-ocp421.yaml. The operator expands this into the
# full set of Forklift deployments.
---
apiVersion: forklift.konveyor.io/v1beta1
kind: ForkliftController
metadata:
  name: forklift-controller
  namespace: konveyor-forklift
spec:
  feature_validation: 'true'
  feature_volume_populator: 'true'
