---
extends: substitution
message: "Use '%s' instead of '%s'."
link: https://developers.google.com/style/abbreviations
level: error
ignorecase: true
nonword: true
# Prose only, so that code and paths aren't flagged.
scope: text
swap:
  '\be\.\s?g\.?(?=[\s,;:)])': for example
  '\bi\.\s?e\.?(?=[\s,;:)])': that is
