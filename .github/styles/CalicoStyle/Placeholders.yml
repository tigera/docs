---
extends: existence
message: "Placeholder '%s' doesn't follow the style guide. Use a descriptive <lowercase-hyphenated> name with no instruction text. See contributors/style-guide.md."
level: warning
ignorecase: false
# Placeholders live inside code spans and code blocks, which the default text
# scope skips, so this rule matches the raw source.
# Vale's MDX handling drops anything that looks like a tag, including
# <your-name> and <xxx>, before any scope sees it, so those forms can't be
# caught here. This rule catches the instruction-text forms only.
scope: raw
tokens:
  - 'INSERT_[A-Z0-9_]+'
  - '[A-Z0-9_]+_HERE\b'
