nodeLinker: pnpm

# Imports that these packages use but do not declare, which the strict pnpm linker exposes.
packageExtensions:
  "@swaggerexpert/json-pointer@^2":
    peerDependencies:
      "@swagger-api/apidom-core": "*"
  "safe-buffer@^5":
    dependencies:
      buffer: "^6.0.3"
  "swagger-ui-react@^5":
    dependencies:
      to-buffer: "^1.2.1"
